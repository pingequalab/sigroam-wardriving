# Tag-triggered release: build one .fap against the Official SDK and publish it.
#
# Why one artifact and not one per firmware:
# `application.fam` declares no firmware-specific API. The Catalog requires the
# Official SDK build (C4). The loader compares the API major exactly; the minor
# half of the check is commented out in Official 1.5.1, Momentum mntm-012, and
# Unleashed unlshd-094. Measured 2026-10-17 from each release channel:
# Official 1.5.1 is API 88.2, Unleashed unlshd-094 is API 88.19, Momentum
# mntm-012 is API 87.1. This file loads where the major matches the Official
# SDK it was built with. It does not load on Momentum while that release stays
# on major 87. fap-build.yml still compiles all three; this job uploads only
# the Official file.
#
# Manifest layout is a separate gate from the API major. Official and Unleashed
# use the OFW manifest. Momentum appends a `flags` byte and accepts a shorter
# OFW manifest, defaulting the flags. The Official loader guards `.fapmeta`
# only from below, then reads the section size into the struct, so a longer
# Momentum manifest is read past the end. Shipping the Official build is the
# safe direction. An earlier diff against Momentum, both then API 87.1, found
# the two files differed in the debuglink CRC and that manifest byte (V-076).
# Those API majors no longer match, so that diff is not a reason to treat one
# file as covering both.
#
# fap-build.yml builds Official, Momentum, and Unleashed on every push. Official
# and Momentum are the compile-time guard against firmware-specific APIs (C4);
# dropping either would let a Momentum-only symbol reach this workflow undetected.
#
# Why this is a third workflow rather than a job inside fap-build.yml:
# fap-build runs on every push and pull request and must stay read-only
# (`permissions: contents: read`). Publishing a release needs `contents: write`,
# and widening the permission on the workflow that runs on every PR would hand
# write access to any pull request build. Splitting keeps the write scope on the
# one workflow that only ever runs from a tag on this repository.
#
# Why `gh release create` and not a third-party release action:
# the GitHub CLI is preinstalled on the runner image (GitHub CLI 2.98.0 on
# ubuntu-24.04, which is what ubuntu-latest currently resolves to -- see
# actions/runner-images images/ubuntu/Ubuntu2404-Readme.md). Using it removes a
# third-party dependency from the release path entirely, which matters more here
# than in the build workflows: this is the job that produces the artifact users
# actually install on their device.
#
# Why the tag is checked against application.fam:
# the Flipper Apps Catalog reads the version from `fap_version`, while users read
# it from the release tag. If the two disagree, the catalog and the download page
# advertise different versions of the same build and there is no way to tell from
# the .fap which one is right. The guard makes that mismatch a failed release
# instead of a silent inconsistency.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Guard first, in its own job: a version mismatch should fail before an SDK
  # download and a build have been spent on it.
  check:
    name: check tag vs fap_version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag and compare with application.fam
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag='${{ inputs.tag }}'
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"

          # Single-quoted class so the shell does not touch the quotes the grep needs.
          fam=$(grep -oE 'fap_version="[^"]+"' application.fam | head -1 | cut -d'"' -f2)
          if [ -z "$fam" ]; then
            echo "::error::could not read fap_version from application.fam"
            exit 1
          fi
          if [ "$version" != "$fam" ]; then
            echo "::error::tag $tag implies version $version but application.fam has fap_version=\"$fam\""
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag $tag matches fap_version=\"$fam\"" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (official SDK)
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}

      # Same pinned sha as fap-build.yml (v0.1.4). A sha rather than a floating
      # tag: tags can be repointed, and a release build should not depend on
      # upstream leaving a tag alone.
      #
      # No sdk-index-url = the official default
      # https://update.flipperzero.one/firmware/directory.json.
      - name: Build FAP
        id: build
        uses: flipperdevices/flipperzero-ufbt-action@e7cd34914e61ddc056acd8daaab96d8b4d4d9f55 # v0.1.4
        with:
          sdk-channel: release
          sdk-hw-target: f7

      # fbt always names the output after the appid, so rename it to the name the
      # release advertises before it becomes an artifact.
      - name: Stage the .fap under its release name
        run: |
          set -euo pipefail
          mkdir -p staged
          fap=$(find ${{ steps.build.outputs.fap-artifacts }} -name '*.fap' -type f | head -1)
          if [ -z "$fap" ]; then
            echo "::error::no .fap produced"
            exit 1
          fi
          cp "$fap" "staged/sigroam-${{ needs.check.outputs.version }}.fap"
          ls -l staged/

      # The API major decides which firmwares can load this file (V-074), so it
      # belongs in the run summary next to the SDK it was built against.
      - name: Record SDK / API version
        run: |
          {
            echo "### official SDK"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| SDK version | \`${{ fromJSON(steps.build.outputs.ufbt-status).version }}\` |"
            echo "| API version | \`${{ steps.build.outputs.api-version }}\` |"
            echo "| hw target | \`${{ fromJSON(steps.build.outputs.ufbt-status).target }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staged FAP
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: staged/*.fap
          if-no-files-found: error

  publish:
    name: publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}

      - name: Download built FAP
        uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      # The artifact must exist and be non-empty. An empty upload would still
      # publish a release, and the failure would only surface on a user's device.
      - name: Verify the artifact is present
        run: |
          set -euo pipefail
          ls -l dist/
          f="dist/sigroam-${{ needs.check.outputs.version }}.fap"
          if [ ! -s "$f" ]; then
            echo "::error::missing or empty artifact: $f"
            exit 1
          fi

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          {
            echo "SigRoam $VERSION for the Flipper Zero."
            echo ""
            echo "Receive-only Wi-Fi survey front-end driving an external ESP32 Marauder scanner."
            echo ""
            echo "This file is built with the Official release SDK. The loader compares"
            echo "the API major and ignores the minor, so it loads only on firmware"
            echo "with that same major."
            echo ""
            echo "Copy it to \`SD Card/apps/GPIO/\` on the Flipper."
            echo ""
            echo "A different major needs the matching build from the fap_build matrix"
            echo "(official, momentum, unleashed). Do not bypass an API-mismatch warning."
            echo ""
            if [ -f CHANGELOG.md ]; then
              echo "See [CHANGELOG.md](CHANGELOG.md) for the full change list."
            fi
          } > "$notes"

          # Re-running a tag should refresh the assets rather than fail outright.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.fap --clobber
            gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" dist/*.fap \
              --title "SigRoam $VERSION" \
              --notes-file "$notes"
          fi
          gh release view "$TAG" --json tagName,isDraft,assets \
            --jq '"published " + .tagName + " draft=" + (.isDraft|tostring) + " assets=" + ([.assets[].name]|join(", "))'
