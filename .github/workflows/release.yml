# Tag-triggered release: publish two .fap files from the fap_build matrix.
#
# fap_build.yml already compiles Official, Momentum, and Unleashed on the same
# ufbt action. This workflow does not compile again. It takes the Official and
# Momentum artifacts from the successful fap_build run of the tagged commit.
# Unleashed is left there: its API major matches Official, and both use the
# 85-byte OFW manifest, so the Official file is the one that loads on both.
#
# Measured 2026-10-17:
#   Official 1.5.1       API 88.2   .fapmeta 85 bytes
#   Unleashed unlshd-094 API 88.19  .fapmeta 85 bytes
#   Momentum mntm-012    API 87.1   .fapmeta 86 bytes (one flags byte)
#   Official 1.4.3       API 87.1
# The loader compares the API major and ignores the minor. The Official file
# is for major 88 (current Official and Unleashed). The Momentum file is for
# major 87 (current Momentum, and Official firmware that is still on 1.4.3).
# There is no separate Unleashed asset.
#
# The Momentum manifest is one byte longer than the OFW struct. Official's
# loader accepts a section at least as long as the struct and then reads the
# section length into it. major 87 is what 1.4.3 checks, and the Official
# release channel no longer builds major 87, so the Momentum artifact is the
# file that release ships for those devices.
#
# Why this stays a separate workflow:
# fap-build runs on pushes and pull requests and must stay read-only
# (`permissions: contents: read`). Publishing needs `contents: write`.
# Splitting keeps that write scope on the workflow that runs from a tag.
#
# Why `gh release create` and not a third-party release action:
# the GitHub CLI is preinstalled on the runner image (GitHub CLI 2.98.0 on
# ubuntu-24.04, which is what ubuntu-latest currently resolves to -- see
# actions/runner-images images/ubuntu/Ubuntu2404-Readme.md). Using it removes a
# third-party dependency from the release path entirely, which matters more here
# than in the build workflows: this is the job that produces the artifact users
# actually install on their device.
#
# Why the tag is checked against application.fam:
# the Flipper Apps Catalog reads the version from `fap_version`, while users read
# it from the release tag. If the two disagree, the catalog and the download page
# advertise different versions of the same build and there is no way to tell from
# the .fap which one is right. The guard makes that mismatch a failed release
# instead of a silent inconsistency.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Guard first, in its own job: a version mismatch should fail before the
  # matrix artifacts are downloaded.
  check:
    name: check tag vs fap_version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag and compare with application.fam
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag='${{ inputs.tag }}'
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"

          # Single-quoted class so the shell does not touch the quotes the grep needs.
          fam=$(grep -oE 'fap_version="[^"]+"' application.fam | head -1 | cut -d'"' -f2)
          if [ -z "$fam" ]; then
            echo "::error::could not read fap_version from application.fam"
            exit 1
          fi
          if [ "$version" != "$fam" ]; then
            echo "::error::tag $tag implies version $version but application.fam has fap_version=\"$fam\""
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag $tag matches fap_version=\"$fam\"" >> "$GITHUB_STEP_SUMMARY"

  stage:
    name: stage official and momentum
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      official: ${{ steps.name.outputs.official }}
      momentum: ${{ steps.name.outputs.momentum }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}

      - name: Find the fap_build run for this commit
        id: faprun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "tagged commit $sha"

          # A push to main may already have finished. A tag push starts another
          # fap_build run; wait only when nothing has succeeded yet.
          run_id=""
          for _ in $(seq 1 45); do
            json=$(gh run list --workflow fap-build.yml --commit "$sha" --limit 20 \
              --json databaseId,status,conclusion,createdAt)
            run_id=$(printf '%s' "$json" | jq -r '[.[] | select(.conclusion=="success")] | sort_by(.createdAt) | last | .databaseId // empty')
            if [ -n "$run_id" ]; then
              break
            fi
            pending=$(printf '%s' "$json" | jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending" or .status=="requested")] | length')
            if [ "$pending" = "0" ]; then
              echo "::error::no successful fap_build run for $sha"
              printf '%s\n' "$json"
              exit 1
            fi
            echo "fap_build still running for $sha"
            sleep 30
          done
          if [ -z "$run_id" ]; then
            echo "::error::timed out waiting for fap_build on $sha"
            exit 1
          fi
          echo "using fap_build run $run_id"
          echo "id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download Official artifact
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.faprun.outputs.id }}
          github-token: ${{ github.token }}
          pattern: sigroam-official-*
          path: incoming/official

      - name: Download Momentum artifact
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.faprun.outputs.id }}
          github-token: ${{ github.token }}
          pattern: sigroam-momentum-*
          path: incoming/momentum

      - name: Name the two release files from the manifest
        id: name
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import struct
          import sys
          from pathlib import Path

          version = os.environ["VERSION"]

          def manifest(path):
              data = Path(path).read_bytes()
              if data[:4] != b"\x7fELF" or data[4] != 1:
                  sys.exit(f"{path} is not a 32-bit ELF")
              e_shoff = struct.unpack_from("<I", data, 32)[0]
              e_shentsize = struct.unpack_from("<H", data, 46)[0]
              e_shnum = struct.unpack_from("<H", data, 48)[0]
              e_shstrndx = struct.unpack_from("<H", data, 50)[0]
              raw = []
              for i in range(e_shnum):
                  off = e_shoff + i * e_shentsize
                  name_off, _, _, _, sec_off, sec_size = struct.unpack_from("<IIIIII", data, off)
                  raw.append((name_off, sec_off, sec_size))
              str_off, str_size = raw[e_shstrndx][1], raw[e_shstrndx][2]
              strtab = data[str_off:str_off + str_size]
              for name_off, sec_off, sec_size in raw:
                  name = strtab[name_off:strtab.find(b"\0", name_off)].decode()
                  if name == ".fapmeta":
                      meta = data[sec_off:sec_off + sec_size]
                      api = struct.unpack_from("<I", meta, 8)[0]
                      major = (api >> 16) & 0xFFFF
                      return major, len(meta)
              sys.exit(f"{path} has no .fapmeta")

          expected = {"official": 85, "momentum": 86}
          staged = Path("staged")
          staged.mkdir()
          names = {}
          majors = {}
          for firmware, meta_len in expected.items():
              found = sorted(Path("incoming", firmware).rglob("*.fap"))
              if len(found) != 1:
                  sys.exit(f"{firmware}: expected 1 .fap, found {len(found)}")
              major, got = manifest(found[0])
              if got != meta_len:
                  sys.exit(f"{firmware}: .fapmeta is {got} bytes, expected {meta_len}")
              if major <= 0:
                  sys.exit(f"{firmware}: API major {major}")
              dest = staged / f"sigroam-{version}-{firmware}-api{major}.fap"
              dest.write_bytes(found[0].read_bytes())
              names[firmware] = dest.name
              majors[firmware] = major
              print(f"{firmware} {dest.name} meta={got} major={major} bytes={dest.stat().st_size}")
          if majors["official"] == majors["momentum"]:
              sys.exit("official and momentum API majors match")
          if names["official"] == names["momentum"]:
              sys.exit("official and momentum resolved to the same filename")
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write(f"official={names['official']}\n")
              fh.write(f"momentum={names['momentum']}\n")
          PY
          ls -l staged/

      - name: Upload staged FAPs
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: staged/*.fap
          if-no-files-found: error

  publish:
    name: publish release
    needs: [check, stage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}

      - name: Download staged FAPs
        uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Verify both files
        env:
          OFFICIAL: ${{ needs.stage.outputs.official }}
          MOMENTUM: ${{ needs.stage.outputs.momentum }}
        run: |
          set -euo pipefail
          ls -l dist/
          count=$(find dist -name '*.fap' -type f | wc -l)
          if [ "$count" != "2" ]; then
            echo "::error::expected 2 .fap files, found $count"
            exit 1
          fi
          for f in "dist/$OFFICIAL" "dist/$MOMENTUM"; do
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty artifact: $f"
              exit 1
            fi
          done

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
          OFFICIAL: ${{ needs.stage.outputs.official }}
          MOMENTUM: ${{ needs.stage.outputs.momentum }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          {
            echo "SigRoam $VERSION for the Flipper Zero."
            echo ""
            echo "Receive-only Wi-Fi survey front-end driving an external ESP32 Marauder scanner."
            echo ""
            echo "Two files. Copy one of them to \`SD Card/apps/GPIO/\`."
            echo "Do not bypass an API-mismatch warning."
            echo ""
            echo "- \`$OFFICIAL\` is the Official release SDK build. Use it on Official and Unleashed when the firmware API major matches that file. There is no separate Unleashed file."
            echo "- \`$MOMENTUM\` is the Momentum release SDK build. Use it on Momentum, and on Official firmware that is still on that API major."
            echo ""
            if [ -f CHANGELOG.md ]; then
              echo "See [CHANGELOG.md](CHANGELOG.md) for the full change list."
            fi
          } > "$notes"

          # Re-running a tag should refresh the assets rather than fail outright.
          # The previous single name sigroam-$VERSION.fap is not one of these two.
          if gh release view "$TAG" >/dev/null 2>&1; then
            old="sigroam-${VERSION}.fap"
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$old"; then
              gh release delete-asset "$TAG" "$old" --yes
            fi
            gh release upload "$TAG" "dist/$OFFICIAL" "dist/$MOMENTUM" --clobber
            gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" "dist/$OFFICIAL" "dist/$MOMENTUM" \
              --title "SigRoam $VERSION" \
              --notes-file "$notes"
          fi
          gh release view "$TAG" --json tagName,isDraft,assets \
            --jq '"published " + .tagName + " draft=" + (.isDraft|tostring) + " assets=" + ([.assets[].name]|join(", "))'
