# T1.3c stage two: the ADR-007 Official + Momentum ufbt build.
# Unleashed is a third row on this same action. It does not replace the other two.
# Measured 2026-10-17 from each release channel: Official 1.5.1 is API 88.2,
# Momentum mntm-012 is API 87.1, Unleashed unlshd-094 is API 88.19. Sharing a
# major is not a reason to drop a row. The indexes differ, and a symbol can
# exist on only one of them.
# release.yml publishes the official and momentum artifacts from a successful
# run of this workflow. It does not publish the unleashed artifact.
#
# Why this is split from host-test.yml: the two have completely different failure modes --
# host_test depends only on a compiler, while this one pulls SDK indexes and toolchains over the
# network, which is slower and more brittle.
# Splitting the files keeps a red on one side from polluting the other's green baseline, and makes
# it obvious on a PR which layer broke.
#
# Why both targets must run (this is not redundancy):
# The Catalog hard-requires that the app build with the Official SDK (C4, see
# docs/spikes/SPIKE-00-catalog.md), while the local device actually runs Momentum.
# Momentum-proprietary APIs (expansion_is_connected /
# expansion_set_listen_serial / storage_common_rename_safe and others, see V-039 / V-047)
# are a trap that only explodes at **link time** on Official -- neither the editor nor a local
# build catches them.
# This matrix moves that trap into CI where it detonates immediately.
#
# Why an API number is not asserted:
# Every row uses that firmware's release channel, and channels float.
# Hard-asserting a version would turn an upstream release into a red unrelated
# to any commit in this repository. The only hard gate is
# "every matrix target builds successfully and really produces a .fap";
# the version numbers are recorded in the step summary and artifact names as evidence.

name: fap_build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fap:
    name: fap (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # An empty index-url = the official default https://update.flipperzero.one/firmware/directory.json
          # (the action's internal `if [ -n ... ]` skips on empty; verified in its action.yml source)
          - name: official
            sdk-index-url: ''
          # Trailing slash, no directory.json -- the json_index recorded by ufbt status in the
          # local .ufbt-momentum has exactly this shape, proving ufbt accepts it (V-048)
          - name: momentum
            sdk-index-url: 'https://up.momentum-fw.dev/firmware/'
          # Same action, channel, and f7 target. Unleashed documents this index
          # for ufbt: https://up.unleashedflip.com/directory.json
          # The bare host 404s; the file is the index. This row is the link check
          # against Unleashed's own symbol table. release.yml does not publish
          # it: Official and Unleashed share the API major, and the Official
          # .fapmeta is the 85-byte layout both loaders accept.
          - name: unleashed
            sdk-index-url: 'https://up.unleashedflip.com/directory.json'

    steps:
      - uses: actions/checkout@v7

      # Pinned to the commit sha of v0.1.4 (v0.1 and v0.1.4 currently point at the same commit).
      # A sha rather than a floating tag: tags can be repointed, and build reproducibility should
      # not depend on upstream leaving a tag alone.
      - name: Build FAP
        id: build
        uses: flipperdevices/flipperzero-ufbt-action@e7cd34914e61ddc056acd8daaab96d8b4d4d9f55 # v0.1.4
        with:
          sdk-channel: release
          sdk-index-url: ${{ matrix.sdk-index-url }}
          sdk-hw-target: f7

      - name: Record SDK / API version
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| SDK version | \`${{ fromJSON(steps.build.outputs.ufbt-status).version }}\` |"
            echo "| API version | \`${{ steps.build.outputs.api-version }}\` |"
            echo "| hw target | \`${{ fromJSON(steps.build.outputs.ufbt-status).target }}\` |"
            echo "| index url | \`${{ matrix.sdk-index-url || 'default (update.flipperzero.one)' }}\` |"
            echo "| toolchain | \`${{ steps.build.outputs.toolchain-version }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # if-no-files-found: error is a deliberate guard against a no-op run:
      # without it, a run where the build step exits 0 but produces no .fap would still show green.
      # The name starts with the matrix row so release.yml can take official and
      # momentum and leave unleashed in this workflow.
      - name: Upload FAP
        uses: actions/upload-artifact@v7
        with:
          name: sigroam-${{ matrix.name }}-${{ steps.build.outputs.suffix }}
          path: ${{ steps.build.outputs.fap-artifacts }}
          if-no-files-found: error
